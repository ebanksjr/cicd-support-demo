name: Production CI/CD Build and Container Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  compile-and-ship:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Application Code Base
      uses: actions/checkout@v4

    - name: Configure Secure Cloud Isolation
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to Enterprise Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT }}

    - name: Compile and Push Container Application Layer
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}/demo-app:latest
